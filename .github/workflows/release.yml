name: Build & Release Saathi AI APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          mkdir -p release-assets
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Saathi-AI-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag }}
          name: "Saathi AI ${{ steps.prepare_asset.outputs.tag }}"
          body: |
            ### 🤖 Saathi AI (साथी AI)
            Autonomous Voice-First Mobile AI Companion for Android.

            #### 📱 What's in this release:
            - **Autonomous Task Execution**: Translates spoken intent into discrete on-screen mobile actions.
            - **Voice-First Navigation**: Hands-free speech recognition and conversational audio feedback.
            - **Multi-LLM Provider Engine**: Seamless failover across Gemini, Groq, Claude, OpenAI, and local models.
            - **Accessibility Automation**: Intelligent UI tree traversal, click dispatching, and automated app workflows.
            - **4-Tier Knowledge Graph**: Working memory, episodic conversation history, user preferences, and Keystore-encrypted credentials.
            - **Safety & Privacy Critic**: Prevents risky or irreversible system actions before execution.

            #### 📥 Installation:
            Download and install `Saathi-AI-${{ steps.prepare_asset.outputs.tag }}.apk` on any Android device running Android 8.0 (API 26) or higher. Enable Accessibility and Microphone permissions on first launch.
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
